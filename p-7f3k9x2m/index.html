<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVEBI: დამტენების რუკა</title>
<meta name="description" content="საქართველოს დამტენი სადგურების რუკა, შენი გარაჟი და მარშრუტი დატენვის გაჩერებებით.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="css/map.css?v=3">
</head>
<body class="mapbody">
<header class="mbar">
  <a href="index.html" aria-label="EVEBI"><img src="assets/logo.png" alt="EVEBI"></a>
  <nav aria-label="მენიუ">
    <a href="home.html#questions">კითხვები</a>
    <a href="home.html#calc">კალკულატორი</a>
    <a href="home.html#guides">გიდები</a>
  </nav>
</header>

<div class="shell">
  <aside class="panel" id="panel">
    <div class="tabs" role="tablist">
      <button role="tab" class="tab on" data-t="stations" aria-selected="true">სადგურები</button>
      <button role="tab" class="tab" data-t="route" aria-selected="false">მარშრუტი</button>
      <button role="tab" class="tab" data-t="garage" aria-selected="false">ჩემი გარაჟი</button>
    </div>

    <section class="tp on" id="tp-stations">
      <p class="status" id="status">სადგურები იტვირთება…</p><p class="hint" style="margin:-8px 0 14px;font-size:12px">ვერსია 3 · რუკა: OpenStreetMap</p>
      <p class="lab">კონექტორი</p>
      <div class="chips" id="connChips">
        <button class="chip" data-k="ccs">CCS2</button>
        <button class="chip" data-k="type2">Type 2</button>
        <button class="chip" data-k="chademo">CHAdeMO</button>
        <button class="chip" data-k="tesla">Tesla</button>
        <button class="chip" data-k="gbt">GB/T</button>
      </div>
      <label class="chk"><input type="checkbox" id="fastOnly"> მხოლოდ სწრაფი (DC)</label>
      <label class="chk"><input type="checkbox" id="showUnknown" checked> ვაჩვენო სადგურები, სადაც კონექტორი არ არის მითითებული</label>
      <p class="hint">მონაცემები OpenStreetMap-იდანაა და შეიძლება არასრული იყოს. დაინახე შეცდომა? <a href="mailto:contact@evebi.ge?subject=რუკის შესწორება">მოგვწერე</a>.</p>
    </section>

    <section class="tp" id="tp-route">
      <p class="lab" id="carLine"></p>
      <div class="f"><label for="from">საიდან</label><select id="from"></select></div>
      <div class="f"><label for="to">სად</label><select id="to"></select></div>
      <button class="go" id="goRoute">გამოთვალე მარშრუტი</button>
      <div id="routeOut" aria-live="polite"></div>
    </section>

    <section class="tp" id="tp-garage">
      <p class="hint" style="margin-top:0">მანქანის მონაცემი ინახება მხოლოდ შენს ბრაუზერში. მარშრუტი და ფილტრი მათ იყენებს.</p>
      <div class="f"><label for="gName">მანქანა</label><input id="gName" type="text" placeholder="მაგ: BYD Seal"></div>
      <div class="f"><label for="gRange">რეალური დიაპაზონი, კმ</label><input id="gRange" type="number" min="50" max="1000" step="10" placeholder="300"></div>
      <div class="f"><label for="gConn">კონექტორი</label>
        <select id="gConn"><option value="">არ მაქვს არჩეული</option><option value="ccs">CCS2</option><option value="type2">Type 2</option><option value="chademo">CHAdeMO</option><option value="tesla">Tesla</option><option value="gbt">GB/T</option></select></div>
      <div class="f"><label for="gRes">მარაგი, % (ამდენზე ნაკლები არ გინდა დარჩეს)</label><input id="gRes" type="number" min="5" max="40" step="1" value="15"></div>
      <button class="go" id="saveGarage">შენახვა</button>
      <p class="hint" id="gMsg"></p>
    </section>
  </aside>
  <div id="map" role="application" aria-label="დამტენი სადგურების რუკა"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="js/map.js?v=3"></script>
</body>
</html>
